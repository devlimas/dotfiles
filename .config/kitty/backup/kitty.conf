include ~/.config/kitty/

confirm_os_window_close 0

background_opacity 0.70
font_family JetBrainsMono Nerd Font Mono
font_size 13
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
mouse_hide_wait  3.0
cursor_shape     block
url_color        #00FFFF
url_style        dashed


# Tokyo Night color scheme for kitty terminal emulator
# https://github.com/davidmathers/tokyo-night-kitty-theme
#
# Based on Tokyo Night color theme for Visual Studio Code
# https://github.com/enkia/tokyo-night-vscode-theme

foreground #a9b1d6
background #1a1b26

# Black
color0 #45475A
color8 #585B70

# Red
color1 #f7768e
color9 #F38BA8

# Green
color2  #73daca
color10 #A6E3A1

# Yellow
color3  #e0af68
color11 #F9E2AF

# Blue
color4  #7aa2f7
color12 #89B4FA

# Magenta
color5  #bb9af7
color13 #F5C2E7

# Cyan
color6  #7dcfff
color14 #94E2D5

# White
color7 #A6ADC8
color15  #c0caf5

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26

# Selection highlight
selection_foreground none
selection_background #28344a

# The color for highlighting URLs on mouse-over
url_color #9ece6a

# Window borders
active_border_color #3d59a1
inactive_border_color #101014
bell_border_color #e0af68

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #3d59a1
active_tab_background   #0a0a0c
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #0d0d0e
inactive_tab_font_style bold
tab_bar_background #0a0a0b

# Title bar
macos_titlebar_color #0b0b0c

# Storm
# background #24283b
# cursor_text_color #24283b
# active_tab_background   #1f2335
# inactive_tab_background #1f2335
# macos_titlebar_color #1f2335

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

include ~/.cache/wal/colors-kitty.conf
allow_remote_control yes
listen_on unix:/tmp/mykitty
