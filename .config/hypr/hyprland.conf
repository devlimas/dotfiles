#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
  gaps_in = 10
  gaps_out = 20
  border_size = 1
  col.active_border = rgba(262626aa)
  col.inactive_border = rgba(111111aa)
  layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 6
  active_opacity = 0.9
  inactive_opacity = 0.9
    
    blur {
      enabled = true
      size = 5
      passes = 2
      ignore_opacity = true
      popups = true
      new_optimizations = true
      noise = 0.0200
      contrast = 1
      brightness = 0.8172
      vibrancy = 0.1696
    }

  shadow {
    enabled = true
    range = 20
    render_power = 4
    color = rgba(000000b3)
    ignore_window = true
  }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Encerra a aplicação
bind = $mainMod, X, killactive

# Terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Escape, exec, kitty --class btop -e btop

# Java(Intellij) e VisualCode
bind = $mainMod, J, exec, $java
bind = $mainMod, V, exec, $visualCode

#Tools
bind = $mainMod, G, exec, $gimp
bind = $mainMod, R, exec, $bruno
bind = $mainMod, A, exec, $anki

# Game
bind = $mainMod, S, exec, $game

# Possivel alteração
bind = $mainMod, Y, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# FileManager
bind = $mainMod, E, exec, $fileManager

# Menu
bind = $mainMod, ALT_L, exec, $menu

# Possivel alteração
#bind = $mainMod, P, pseudo,

# Cliphist
bind = $mainMod, C, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/themes/rofi-clipboard.rasi | cliphist decode | wl-copy

# Notifications
bind = SUPER, N, exec, swaync-client -t -sw

# Tools

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, D, exec, $docker
bind = $mainMod SHIFT, D, exec, $discord

bind = $mainMod, O, exec, $obsidian
bind = $mainMod SHIFT, O, exec, $obs

bind = $mainMod, K, exec, $kate
bind = $mainMod SHIFT, K, exec, $kalk

bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen

bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $web

bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, wlogout

bind = $mainMod, W, exec, $whatsapp
bind = $mainMod SHIFT, W, togglefloating,

bind = $mainMod, M, exec, $music
bind = $mainMod SHIFT, M, exec, $minecraft

bind = SUPER_SHIFT, S, exec, pavucontrol

bind = SUPER, Print, exec, hyprshot -m output -o ~/Pictures/Screenshots/
bind = ALT, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots/
bind = ALT SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots/ --clipboard-only

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD

# Volume pamixer
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh --inc
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh --dec
bindl  = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh --toggle
bindl  = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume.sh --toggle-mic

bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh --inc
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh --dec

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
