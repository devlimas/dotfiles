#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# Nome do monitor, resolução, fps, posição(0x0 para ser sempre o center), escala
monitor=eDP-1,1920x1080@60,0x0,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = ~/.config/rofi/launch.sh
$browser = flatpak run app.zen_browser.zen
$web = brave --ozone-platform-hint=auto
$music = ~/.local/bin/youtube-music.AppImage --no-sandbox
$java = intellij-idea-ultimate-edition
$visualCode = code --ozone-platform-hint=auto
$game = steam
$obsidian = obsidian
$gimp = gimp
$obs = obs
$bruno = bruno
$anki = anki
$kate = kate
$discord = vesktop
$minecraft = /home/lima/TLauncher.sh
$whatsapp = wasistlos
$kalk = kalk
$docker = "/opt/docker-desktop/Docker Desktop"

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = kbuildsycoca6

exec-once = wal -R

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = hypridle
exec-once = hyprpaper

exec-once = waybar

exec-once = swaync
exec-once = nwg-dock-hyprland -i 48 -p bottom -a center -mb 15 -f -d

exec-once = fcitx5 -d

#exec-once = mpvpaper -o "no-audio --loop-playlist" eDP-1 /home/lima/Meu/Wallpapers/animado/Japao_Para_Editar.mp4
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_THEME,ArcStarry-cursors
env = XCURSOR_SIZE,27
env = HYPRCURSOR_SIZE,27

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland,x11*

env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
#env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
#env = QT_STYLE_OVERRIDE,kvantum
#env = QT_STYLE_OVERRIDE=Fusion systemsettings
#env = QT_QPA_PLATFORMTHEME,kde

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = XDG_MENU_PREFIX,arch-



